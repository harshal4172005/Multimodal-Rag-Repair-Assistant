<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Appliance Repair Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Appliance Repair Assistant</h1>
    <p class="subtitle">Ask a question about your appliance manual.</p>
    <div id="chat"></div>
    <form id="ask-form">
      <input id="question" type="text" placeholder="e.g. why is my washing machine leaking?" autocomplete="off" required>
      <button type="submit">Ask</button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
